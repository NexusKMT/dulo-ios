name: Dulo
options:
  bundleIdPrefix: dev.dulo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "12"
targets:
  Dulo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dulo.player
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TrollStore fakesigns ad-hoc IPAs on install; no certificate needed.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Dulo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Dulo 需要访问局域网内的媒体服务器以加载视频。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  DuloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Dulo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dulo:
    build:
      targets:
        Dulo: all
        DuloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DuloTests]
    archive:
      config: Release
