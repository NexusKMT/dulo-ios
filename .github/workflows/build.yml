name: Build IPA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (simulator)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -n "$DEVICE_ID" ]; then
            DEST="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "Testing on destination: $DEST"
          xcodebuild test -project Dulo.xcodeproj -scheme Dulo \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (unsigned; TrollStore signs on install)
        run: |
          xcodebuild archive -project Dulo.xcodeproj -scheme Dulo \
            -destination 'generic/platform=iOS' \
            -archivePath build/Dulo.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Dulo.xcarchive/Products/Applications/Dulo.app Payload/
          zip -r -X Dulo.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Dulo.ipa
          path: Dulo.ipa
